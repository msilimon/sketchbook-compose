apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.dokka'

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    if (project.plugins.findPlugin("com.android.library")) {
        from android.sourceSets.main.java.srcDirs
        from android.sourceSets.main.kotlin.srcDirs
    } else {
        from sourceSets.main.java.srcDirs
        from sourceSets.main.kotlin.srcDirs
    }
}

tasks.withType(dokkaHtmlPartial.getClass()).configureEach {
    pluginsMapConfiguration.set(
            ["org.jetbrains.dokka.base.DokkaBase": """{ "separateInheritedMembers": true}"""]
    )
}

task javadocJar(type: Jar, dependsOn: dokkaJavadoc) {
    archiveClassifier.set('javadoc')
    from dokkaJavadoc.outputDirectory
}

artifacts {
    archives androidSourcesJar
    archives javadocJar
}

group = project.findProperty("group") ?: PUBLISH_GROUP_ID
version = project.findProperty("version") ?: PUBLISH_VERSION

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = project.findProperty("group") ?: PUBLISH_GROUP_ID
                artifactId = PUBLISH_ARTIFACT_ID
                version = project.findProperty("version") ?: PUBLISH_VERSION

                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    from components.java
                }

                artifact androidSourcesJar
                artifact javadocJar

                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = 'Sketchbook lets you build drawings on canvas with color palettes for Jetpack Compose.'
                    url = 'https://github.com/msilimon/sketchbook-compose'

                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'skydoves'
                            name = 'Jaewoong Eum'
                        }
                    }

                    scm {
                        connection = 'scm:git:github.com/msilimon/sketchbook-compose.git'
                        developerConnection = 'scm:git:ssh://github.com/msilimon/sketchbook-compose.git'
                        url = 'https://github.com/msilimon/sketchbook-compose'
                    }
                }
            }
        }
    }
}